<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Source for public/og.png (1200x630). Regenerate with scripts/og-shot.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Shantell+Sans:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FCFCFA;
    --ink: #1D1C1A;
    --pencil: #6B675F;
    --red: #C0392B;
    --rule: #E3E1DB;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); }
  .card {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    color: var(--ink);
    padding: 64px 88px 56px;
    display: grid;
    grid-template-columns: 1fr 240px;
    grid-template-rows: auto 1fr auto;
    column-gap: 64px;
    -webkit-font-smoothing: antialiased;
  }
  .top {
    grid-column: 1 / -1;
    font-family: 'Spectral', serif;
    font-weight: 700;
    font-size: 26px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--rule);
  }
  .text { align-self: center; display: flex; flex-direction: column; gap: 40px; }
  h1 {
    font-family: 'Spectral', serif;
    font-weight: 600;
    font-size: 62px;
    line-height: 1.08;
    letter-spacing: -0.015em;
  }
  .mark { position: relative; white-space: nowrap; }
  .mark svg { position: absolute; left: -6%; bottom: -0.2em; width: 112%; height: 0.34em; overflow: visible; }
  .tag {
    font-family: 'Spectral', serif;
    font-size: 30px;
    line-height: 1.4;
    color: var(--pencil);
  }
  .side { align-self: center; display: flex; flex-direction: column; gap: 18px; }
  .portrait { width: 240px; height: 240px; border-radius: 50%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  .note {
    font-family: 'Shantell Sans', cursive;
    font-weight: 500;
    font-size: 24px;
    color: var(--red);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .foot {
    grid-column: 1 / -1;
    font-family: 'Spectral', serif;
    font-size: 24px;
    color: var(--pencil);
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">Dhanesh Neela Mana</div>
    <div class="text">
      <h1>Building for how<br>people <span class="mark">learn<svg viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path d="M2 12 C 40 4, 80 18, 120 9 S 180 6, 198 11" fill="none" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><path d="M14 17 C 60 12, 120 19, 186 14" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/></svg></span>.</h1>
      <div class="tag">Eighteen years of software, most recently as CTO of an ed-tech startup.</div>
    </div>
    <div class="side">
      <img class="portrait" src="../public/dhanesh.jpg" alt="" />
      <div class="note">
        <svg width="30" height="34" viewBox="0 0 26 30" aria-hidden="true"><path d="M22 28 C 8 24, 4 14, 6 3 M2 8 L6 2 L11 7" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/></svg>
        <span>me</span>
      </div>
    </div>
    <div class="foot">dneelamana.com</div>
  </div>
</body>
</html>
