<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Source for public/og.png (1200x630). Regenerate with scripts/og-shot.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,900&family=Source+Sans+3:wght@400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #14231C;
    --ink: #F1EDE3;
    --ink-soft: #A3ADA4;
    --line-strong: #34503F;
    --accent: #E8C15A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); }
  .card {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    color: var(--ink);
    padding: 88px 96px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 72px;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .text { display: flex; flex-direction: column; gap: 26px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 21px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display: flex; align-items: center; gap: 14px;
  }
  .eyebrow .dot { color: var(--accent); font-size: 16px; }
  .name {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 84px;
    line-height: 0.98;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .name em { font-style: italic; color: var(--accent); }
  .tag {
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 31px;
    line-height: 1.35;
    color: var(--ink-soft);
    max-width: 22em;
  }
  .portrait {
    width: 280px; height: 280px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 1px var(--line-strong), 0 0 0 10px var(--paper), 0 0 0 12px var(--accent);
  }
  .foot {
    position: absolute; left: 96px; bottom: 56px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    display: flex; align-items: center; gap: 12px;
  }
  .foot::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="text">
      <div class="eyebrow"><span>Solo founder</span><span class="dot">●</span><span>Learning &amp; education</span></div>
      <div class="name">Building for how<br>people <em>learn.</em></div>
      <div class="tag">Tools that help people build real skills and make them stick.</div>
    </div>
    <img class="portrait" src="../public/dhanesh.jpg" alt="" />
    <div class="foot">dneelamana.com</div>
  </div>
</body>
</html>
